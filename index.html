<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>日历 · Calendar</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191c;
      --muted: #858990;
      --line: #e7e8eb;
      --soft: #f5f5f6;
      --blue: #1674d1;
      --red: #d93636;
      --red-soft: #fff0f0;
      --red-pale: #fff8f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: grid;
      place-items: start center;
      color: var(--ink);
      background: #f7f8fa;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      font-size: 14px;
    }
    button, select { font: inherit; color: inherit; }
    .calendar {
      width: min(100%, 920px);
      overflow: hidden;
      background: #fff;
      border: 1px solid #e9eaed;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(25, 33, 46, .035);
    }
    .summary {
      min-height: 112px;
      padding: 20px 24px 16px;
      display: grid;
      grid-template-columns: 80px minmax(150px, 1fr) minmax(180px, 1.55fr);
      gap: 18px;
      align-items: center;
    }
    .today-tile {
      height: 80px;
      border-radius: 12px;
      background: var(--soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .today-tile .weekday { font-size: 14px; font-weight: 650; }
    .today-tile .day { font-size: 36px; font-weight: 720; line-height: 1.08; letter-spacing: -1px; }
    .summary-date { display: grid; align-content: center; gap: 2px; }
    .summary-date strong { font-size: 19px; font-weight: 690; }
    .summary-date span { color: #34373b; line-height: 1.45; }
    .observances { display: flex; flex-wrap: wrap; align-content: center; gap: 5px 18px; }
    .observances span { min-width: 106px; }
    .toolbar {
      min-height: 61px;
      padding: 10px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control, .icon-button {
      height: 38px;
      border: 1px solid #dedfe3;
      border-radius: 9px;
      background: white;
    }
    .control { padding: 0 11px; cursor: pointer; }
    .control:hover, .icon-button:hover { background: #f8f9fa; border-color: #c9cbd0; }
    .control:focus-visible, .icon-button:focus-visible, .date-cell:focus-visible {
      outline: 3px solid rgba(22, 116, 209, .25); outline-offset: 2px;
    }
    select.control { padding-right: 10px; }
    .year-select { min-width: 94px; }
    .month-select { min-width: 74px; }
    .holiday-select { min-width: 108px; }
    .start-select { min-width: 92px; }
    .icon-button { width: 28px; border: 0; font-size: 21px; line-height: 1; cursor: pointer; color: #444; }
    .toolbar-spacer { flex: 1; }
    .today-button { min-width: 82px; }
    .holiday-status { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .holiday-status.error { color: #b94c22; }
    .calendar-body { padding: 0 22px 12px; }
    .weekdays, .days-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { height: 39px; align-items: center; text-align: center; color: #292b2f; }
    .weekdays span { font-size: 14px; }
    .days-grid { grid-auto-rows: minmax(80px, 1fr); gap: 3px; }
    .date-cell {
      min-width: 0;
      position: relative;
      margin: 1px;
      padding: 9px 7px 6px;
      border: 1.5px solid transparent;
      border-radius: 11px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: background-color .13s ease, border-color .13s ease;
    }
    .date-cell:hover { background: #f7f8fa; }
    .date-cell.selected { border-color: var(--blue); }
    .date-cell.today:not(.selected) { background: #f4f5f6; }
    .date-cell.holiday { background: var(--red-soft); }
    .date-cell.holiday:hover { background: #ffe8e8; }
    .date-cell.outside { color: #a1a3a8; }
    .date-cell.outside .solar { color: inherit; }
    .date-cell.outside.holiday { background: var(--red-pale); }
    .solar { font-size: 21px; font-weight: 680; line-height: 1.1; }
    .lunar { margin-top: 3px; max-width: 100%; overflow: hidden; color: #33363a; font-size: 11px; line-height: 1.3; white-space: nowrap; text-overflow: ellipsis; }
    .weekend .solar, .holiday .solar { color: var(--red); }
    .outside .lunar { color: #aaaeb4; }
    .holiday-mark {
      position: absolute;
      left: 5px; top: 5px;
      color: #ee7c7c;
      font-size: 10px;
      line-height: 1;
    }
    .work-mark {
      position: absolute;
      left: 5px; top: 5px;
      min-width: 22px; height: 21px; padding: 0 4px;
      border-radius: 6px;
      background: #e77800;
      color: #fff;
      font-size: 11px;
      font-weight: 750;
      line-height: 21px;
      text-align: center;
    }
    .date-cell.adjusted-work:not(.selected) { background: #fff5df; }
    .date-cell.adjusted-work:hover { background: #ffedc2; }
    .adjusted-work .lunar { color: #b95700; font-weight: 700; }
    .detail {
      min-height: 79px;
      padding: 14px 24px 13px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(230px, .9fr) 2fr;
      gap: 22px;
      align-items: center;
    }
    .lunar-detail { display: grid; gap: 5px; font-weight: 640; }
    .lunar-detail strong { font-size: 15px; }
    .luck { display: grid; gap: 5px; color: #34363a; font-size: 12px; }
    .luck-line { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .luck-tag { width: 21px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; font-size: 11px; }
    .luck-tag.good { background: #d81717; }
    .luck-tag.avoid { background: #55585e; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      body { padding: 10px 7px; background: #fff; }
      .calendar { border-radius: 12px; }
      .summary { min-height: 100px; padding: 14px; grid-template-columns: 68px 1fr; gap: 12px; }
      .today-tile { height: 70px; }
      .today-tile .day { font-size: 31px; }
      .summary-date strong { font-size: 17px; }
      .observances { grid-column: 1 / -1; padding-left: 80px; gap: 4px 10px; font-size: 12px; }
      .observances span { min-width: 96px; }
      .toolbar { padding: 9px 10px; gap: 4px; flex-wrap: wrap; }
      .control { height: 35px; padding: 0 7px; font-size: 12px; }
      .year-select { min-width: 80px; }
      .month-select { min-width: 66px; }
      .holiday-select { min-width: 86px; }
      .start-select { min-width: 76px; }
      .icon-button { width: 22px; }
      .today-button { min-width: 70px; }
      .calendar-body { padding: 0 7px 8px; }
      .weekdays { height: 34px; }
      .days-grid { grid-auto-rows: minmax(64px, 1fr); gap: 1px; }
      .date-cell { margin: 0; padding: 8px 2px 4px; border-radius: 8px; }
      .solar { font-size: 18px; }
      .lunar { font-size: 10px; }
      .holiday-mark, .work-mark { left: 3px; top: 3px; font-size: 9px; }
      .work-mark { min-width: 19px; height: 19px; line-height: 19px; padding: 0 3px; }
      .detail { padding: 12px 14px; grid-template-columns: 1fr; gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="calendar" aria-label="日历">
    <header class="summary">
      <div class="today-tile" aria-label="今天">
        <span class="weekday" id="summary-weekday">星期一</span>
        <span class="day" id="summary-day">28</span>
      </div>
      <div class="summary-date">
        <strong id="summary-date">2026年9月</strong>
        <span id="summary-week">第271天，第40周</span>
        <span id="summary-today">今天</span>
      </div>
      <div class="observances" id="observances" aria-label="节日"></div>
    </header>

    <nav class="toolbar" aria-label="日历设置">
      <label class="sr-only" for="year">年份</label>
      <select class="control year-select" id="year"></select>
      <button class="icon-button" id="previous" type="button" aria-label="上个月">‹</button>
      <label class="sr-only" for="month">月份</label>
      <select class="control month-select" id="month"></select>
      <button class="icon-button" id="next" type="button" aria-label="下个月">›</button>
      <label class="sr-only" for="holiday-mode">放假安排</label>
      <select class="control holiday-select" id="holiday-mode" title="放假安排">
        <option value="online">联网获取</option>
        <option value="none">不显示假期</option>
      </select>
      <span class="holiday-status" id="holiday-status" role="status" aria-live="polite" title="按年份从 Timor 节假日 API 在线获取；数据源未返回时不会预填日期"></span>
      <label class="sr-only" for="start-day">每周起始日</label>
      <select class="control start-select" id="start-day" title="每周起始日">
        <option value="1">起始日</option>
        <option value="0">周日开始</option>
        <option value="1">周一开始</option>
      </select>
      <span class="toolbar-spacer"></span>
      <button class="control today-button" id="go-today" type="button">返回今天</button>
    </nav>

    <section class="calendar-body" aria-label="月历">
      <div class="weekdays" id="weekdays" aria-hidden="true"></div>
      <div class="days-grid" id="days-grid" role="grid" aria-label="日期"></div>
    </section>

    <footer class="detail" aria-live="polite">
      <div class="lunar-detail" id="lunar-detail"></div>
      <div class="luck">
        <div class="luck-line"><span class="luck-tag good">宜</span><span id="good-list"></span></div>
        <div class="luck-line"><span class="luck-tag avoid">忌</span><span id="avoid-list"></span></div>
      </div>
    </footer>
  </main>
  <script src="lunar.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let shownYear = 2026, shownMonth = 8, selected = new Date(2026, 8, 28);
      let startDay = 1;
      const weekdays = ['日','一','二','三','四','五','六'];
      const lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' });
      const lunarYearFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { year: 'numeric' });
      const lunarMonthNames = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
      const lunarDayNames = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
      const lunarFestivals = { '1-1':'春节', '1-15':'元宵节', '5-5':'端午节', '7-7':'七夕', '7-15':'中元节', '8-15':'中秋节', '9-9':'重阳节', '12-8':'腊八节', '12-23':'北方小年', '12-24':'南方小年' };
      const solarFestivals = { '1-1':'元旦', '2-14':'情人节', '3-8':'妇女节', '5-1':'劳动节', '6-1':'儿童节', '10-1':'国庆节', '12-25':'圣诞节' };
      const holidaySchedules = new Map();
      const key = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
      const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function getHolidayEntry(date) {
        const schedule = holidaySchedules.get(date.getFullYear());
        if (!schedule || schedule.state !== 'ready') return null;
        const dateKey = `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        return schedule.records[dateKey] || null;
      }
      const isMakeupWorkday = entry => !!entry && (entry.isMakeup === true || (entry.holiday !== true && String(entry.name || '').includes('补班')));
      function updateHolidayStatus() {
        const status = $('holiday-status');
        status.classList.remove('error');
        if ($('holiday-mode').value === 'none') { status.textContent = ''; return; }
        const schedule = holidaySchedules.get(shownYear);
        if (!schedule || schedule.state === 'loading') status.textContent = '正在获取…';
        else if (schedule.state === 'ready') status.textContent = '安排已同步';
        else if (schedule.state === 'empty') status.textContent = '暂无可用安排';
        else { status.textContent = '获取失败'; status.classList.add('error'); }
      }
      function loadHolidaySchedule(year) {
        if ($('holiday-mode').value === 'none') return;
        const cached = holidaySchedules.get(year);
        if (cached && cached.state === 'loading') return;
        if (cached && ['ready','empty'].includes(cached.state) && Date.now() < cached.expiresAt) return;
        if (cached?.state === 'error' && Date.now() < cached.retryAt) return;
        holidaySchedules.set(year, {state:'loading', records:{}, retryAt:Date.now()+60000});
        updateHolidayStatus();
        (async () => {
          let receivedResponse = false;
          const sources = [
            async () => {
              const response = await fetch(`https://timor.tech/api/holiday/year/${year}/`, {cache:'no-store'});
              if (!response.ok) throw new Error(`Timor HTTP ${response.status}`);
              const payload = await response.json();
              if (!payload || payload.code !== 0 || !payload.holiday || typeof payload.holiday !== 'object') throw new Error('Invalid Timor data');
              receivedResponse = true;
              return Object.fromEntries(Object.entries(payload.holiday).map(([date, entry]) => [date, {...entry, isMakeup:entry.holiday !== true && String(entry.name || '').includes('补班')} ]));
            },
            async () => {
              const url = `https://gcore.jsdelivr.net/gh/cg-zhou/holiday-calendar@main/data/CN/${year}.json`;
              const response = await fetch(url, {cache:'no-store'});
              if (!response.ok) throw new Error(`Holiday data HTTP ${response.status}`);
              const payload = await response.json();
              if (!payload || !Array.isArray(payload.dates)) throw new Error('Invalid holiday dataset');
              receivedResponse = true;
              return Object.fromEntries(payload.dates.map(item => {
                const date = String(item.date || '');
                const type = item.type;
                const name = item.name_cn || item.name || '';
                return [date.slice(5), {date, name, holiday:type === 'public_holiday', isMakeup:type === 'transfer_workday'}];
              }).filter(([date]) => /^\d{2}-\d{2}$/.test(date)));
            }
          ];
          let records = {};
          for (const source of sources) {
            try {
              const result = await source();
              if (Object.values(result).some(entry => entry && (entry.holiday === true || isMakeupWorkday(entry)))) {
                records = result;
                break;
              }
            } catch (_) { /* Try the next live source. */ }
          }
          const hasSchedule = Object.values(records).some(entry => entry && (entry.holiday === true || isMakeupWorkday(entry)));
          holidaySchedules.set(year, {state:hasSchedule?'ready':receivedResponse?'empty':'error', records, retryAt:Date.now()+60000, expiresAt:Date.now()+(hasSchedule?6:0.25)*60*60*1000});
        })()
          .finally(() => { if (shownYear === year) render(); else updateHolidayStatus(); });
      }
      function chineseNumber(value) {
        const s = String(value).replace(/^闰/, '').replace(/月$/, '');
        const numerals = {零:0,〇:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
        if (s === '正') return 1;
        if (s === '冬') return 11;
        if (s === '腊') return 12;
        if (s.startsWith('廿')) return 20 + (numerals[s[1]] || 0);
        if (s.startsWith('初')) return numerals[s[1]] || 1;
        if (s === '十') return 10;
        if (s.startsWith('十')) return 10 + (numerals[s[1]] || 0);
        if (s.endsWith('十')) return (numerals[s[0]] || 1) * 10;
        if (s.length === 2 && s[0] in numerals && s[1] in numerals) return numerals[s[0]] * 10 + numerals[s[1]];
        return numerals[s] ?? Number(s) ?? 1;
      }
      function lunarParts(date) {
        const parts = Object.fromEntries(lunarFormatter.formatToParts(date).map(p => [p.type,p.value]));
        const day = chineseNumber(parts.day);
        const monthNo = chineseNumber(parts.month);
        return { monthNo, day, monthText: parts.month, dayText: lunarDayNames[day-1] || parts.day };
      }
      function lunarLabel(date) {
        const p = lunarParts(date);
        if (p.day === 1) return p.monthText;
        const fest = lunarFestivals[`${p.monthNo}-${p.day}`];
        if (fest) return fest;
        const solar = solarFestivals[`${date.getMonth()+1}-${date.getDate()}`];
        return solar || p.dayText;
      }
      function formatDate(date) { return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`; }
      function populateSelectors() {
        $('year').innerHTML = Array.from({length: 201}, (_,i) => 1900+i).map(y => `<option value="${y}">${y}年</option>`).join('');
        $('month').innerHTML = Array.from({length:12}, (_,i) => `<option value="${i}">${i+1}月</option>`).join('');
        $('year').value = shownYear; $('month').value = shownMonth;
      }
      function renderWeekdays() {
        $('weekdays').innerHTML = Array.from({length:7}, (_,i) => `<span>${weekdays[(startDay+i)%7]}</span>`).join('');
      }
      function renderSummary() {
        const dayOfWeek = weekdays[selected.getDay()];
        const start = new Date(selected.getFullYear(),0,0);
        const dayNumber = Math.floor((selected-start)/86400000);
        const weekNumber = Math.ceil((dayNumber + start.getDay()) / 7);
        $('summary-weekday').textContent = `星期${dayOfWeek}`;
        $('summary-day').textContent = selected.getDate();
        $('summary-date').textContent = `${selected.getFullYear()}年${selected.getMonth()+1}月`;
        $('summary-week').textContent = `第${dayNumber}天，第${weekNumber}周`;
        $('summary-today').textContent = sameDay(selected,today) ? '今天' : formatDate(selected);
        const f = lunarParts(selected);
        const holidayEntry = getHolidayEntry(selected);
        const workEntry = isMakeupWorkday(holidayEntry) ? holidayEntry : null;
        const festivals = [solarFestivals[`${selected.getMonth()+1}-${selected.getDate()}`], lunarFestivals[`${f.monthNo}-${f.day}`], holidayEntry?.holiday === true ? holidayEntry.name : '', workEntry?.name || '']
          .filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
        $('observances').innerHTML = festivals.map(x => `<span>${escapeHTML(x)}</span>`).join('');
        const yearPart = lunarYearFormatter.format(selected).replace(/^\d+/, '').replace(/年/g, '');
        $('lunar-detail').innerHTML = `<strong>农历 ${f.monthText}${f.dayText}</strong><span>${yearPart}年 · ${f.monthText} · ${f.dayText}</span>`;
        if (typeof Solar !== 'undefined') {
          const almanac = Solar.fromYmd(selected.getFullYear(), selected.getMonth()+1, selected.getDate()).getLunar();
          $('good-list').textContent = almanac.getDayYi().join(' ');
          $('avoid-list').textContent = almanac.getDayJi().join(' ');
        } else {
          $('good-list').textContent = '黄历数据载入失败';
          $('avoid-list').textContent = '黄历数据载入失败';
        }
      }
      function renderGrid() {
        const first = new Date(shownYear, shownMonth, 1);
        const offset = (first.getDay() - startDay + 7) % 7;
        const gridStart = new Date(shownYear, shownMonth, 1-offset);
        const weeks = Math.ceil((offset + new Date(shownYear,shownMonth+1,0).getDate())/7);
        const holidayEnabled = $('holiday-mode').value !== 'none';
        const cells = [];
        for(let i=0;i<weeks*7;i++) {
          const date = new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
          const outside = date.getMonth() !== shownMonth;
          const entry = holidayEnabled ? getHolidayEntry(date) : null;
          const holiday = entry?.holiday === true ? (entry.name || '放假') : '';
          const work = isMakeupWorkday(entry) ? '班' : '';
          const cls = ['date-cell', outside?'outside':'', sameDay(date,selected)?'selected':'', sameDay(date,today)?'today':'', (date.getDay()===0||date.getDay()===6)?'weekend':'', holiday?'holiday':'', work?'adjusted-work':''].filter(Boolean).join(' ');
          const label = `${formatDate(date)}，${lunarLabel(date)}${holiday?`，休假：${holiday}`:''}${work?`，${entry.name || '调休上班'}`:''}`;
          const cellText = work ? '调休上班' : lunarLabel(date);
          cells.push(`<button class="${cls}" type="button" role="gridcell" aria-label="${escapeHTML(label)}" aria-pressed="${sameDay(date,selected)}" data-date="${key(date)}">${holiday?'<span class="holiday-mark">休</span>':''}${work?'<span class="work-mark">班</span>':''}<span class="solar">${date.getDate()}</span><span class="lunar">${escapeHTML(cellText)}</span></button>`);
        }
        $('days-grid').innerHTML = cells.join('');
        $('days-grid').querySelectorAll('[data-date]').forEach(btn => btn.addEventListener('click', () => {
          const [y,m,d] = btn.dataset.date.split('-').map(Number);
          selected = new Date(y,m-1,d);
          if (selected.getMonth() !== shownMonth || selected.getFullYear() !== shownYear) { shownYear = selected.getFullYear(); shownMonth = selected.getMonth(); syncSelectors(); }
          render();
        }));
        if (holidayEnabled) {
          const yearsInGrid = new Set(Array.from({length:weeks*7}, (_,i) => new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i).getFullYear()));
          yearsInGrid.forEach(loadHolidaySchedule);
        }
      }
      function syncSelectors() { $('year').value = shownYear; $('month').value = shownMonth; }
      function render() { renderWeekdays(); renderGrid(); renderSummary(); updateHolidayStatus(); }
      populateSelectors();
      $('year').addEventListener('change', e => { shownYear=Number(e.target.value); selected=new Date(shownYear,shownMonth,Math.min(selected.getDate(),new Date(shownYear,shownMonth+1,0).getDate())); render(); });
      $('month').addEventListener('change', e => { shownMonth=Number(e.target.value); selected=new Date(shownYear,shownMonth,Math.min(selected.getDate(),new Date(shownYear,shownMonth+1,0).getDate())); render(); });
      $('previous').addEventListener('click', () => { const d=new Date(shownYear,shownMonth-1,1); shownYear=d.getFullYear(); shownMonth=d.getMonth(); selected=new Date(shownYear,shownMonth,Math.min(selected.getDate(),new Date(shownYear,shownMonth+1,0).getDate())); syncSelectors(); render(); });
      $('next').addEventListener('click', () => { const d=new Date(shownYear,shownMonth+1,1); shownYear=d.getFullYear(); shownMonth=d.getMonth(); selected=new Date(shownYear,shownMonth,Math.min(selected.getDate(),new Date(shownYear,shownMonth+1,0).getDate())); syncSelectors(); render(); });
      $('go-today').addEventListener('click', () => { shownYear=today.getFullYear(); shownMonth=today.getMonth(); selected=new Date(today); syncSelectors(); render(); });
      $('start-day').addEventListener('change', e => { startDay=Number(e.target.value); render(); });
      $('holiday-mode').addEventListener('change', render);
      render();
    })();
  </script>
</body>
</html>
